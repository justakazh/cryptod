plugins {
    id 'java'
}

version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Burp provides the Montoya API at runtime, so it is compile-only.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.4'
}

// Compile against the Java 17 API using whatever JDK (17+) runs the build.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

jar {
    archiveBaseName = 'cryptod'
}
