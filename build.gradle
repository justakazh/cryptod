plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Burp provides Montoya at runtime, so we only need it to compile.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    archiveBaseName = 'aes-crypto'
}
